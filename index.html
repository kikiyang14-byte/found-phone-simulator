<body>
<div class="layout"><main class="phone wall" id="phone" aria-label="手机模拟器"><div class="wallpaper-layer" id="wallpaper" aria-hidden="true"></div><div class="island" aria-hidden="true"></div><div class="status"><span id="status-time"></span><span id="status-right" role="img" aria-label="信号、Wi-Fi和电量"></span></div><div id="view"></div><nav class="bottom"><button class="homebar" aria-label="返回桌面"></button></nav><div id="toast" class="toast" hidden role="status"></div></main></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({readMessages:[],readNotifications:[],visited:[],clues:[],unlocked:false});
let state=fresh(), storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(CONFIG.storageKey));if(saved&&typeof saved==='object'){for(const key of ['readMessages','readNotifications','visited','clues'])if(Array.isArray(saved[key]))state[key]=saved[key].filter(x=>typeof x==='string');state.unlocked=!!saved.unlocked;}}catch{storageOK=false}
let route={type:'lock'}, history=[],toastTimer;
const save=()=>{try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(state))}catch{storageOK=false}};
const validVisits=new Set([...CONFIG.chats.map(x=>'chat:'+x.id),...CONFIG.photos.map(x=>'photo:'+x.id),...CONFIG.notes.map(x=>'note:'+x.id),...CONFIG.calls.map(x=>'call:'+x.id)]);
state.visited=state.visited.filter(id=>validVisits.has(id));
save();
const add=(key,id)=>{if(!state[key].includes(id))state[key].push(id)};
const contact=id=>CONFIG.contacts.find(c=>c.id===id)||{name:'未知联系人',initials:'?',color:'#7e8e80'};
const ordered=chat=>[...chat.messages].sort((a,b)=>a.sequence!==undefined&&b.sequence!==undefined?a.sequence-b.sequence:(a.time||'').localeCompare(b.time||''));
const recent=items=>[...items].sort((a,b)=>(b.sortKey||b.time||'').localeCompare(a.sortKey||a.time||''));
const lastActivity=chat=>ordered(chat).at(-1)?.time||'';
const chatList=()=>[...CONFIG.chats].sort((a,b)=>Number(b.kind==='program')-Number(a.kind==='program')||lastActivity(b).localeCompare(lastActivity(a)));
document.title=CONFIG.work.title+' · 捡手机剧情模拟器';
const time=t=>t.slice(11,16), date=t=>t.slice(0,10);
const unread=chat=>chat.messages.filter(m=>m.unread&&!state.readMessages.includes(m.id)).length;
const totalUnread=()=>CONFIG.chats.reduce((n,c)=>n+unread(c),0);
const glyphs={
 talk:'<path d="M12 3C5.9 3 1.4 6.5 1.4 10.9c0 3 2.1 5.5 5.4 6.8l-1 3.5 4.2-2.6c.7.1 1.4.2 2 .2 6 0 10.6-3.5 10.6-7.9S18 3 12 3Z" fill="currentColor" stroke="none"/><text x="12" y="12.7" text-anchor="middle" fill="#fee500" stroke="none" font-size="5.2" font-family="Arial,sans-serif" font-weight="800">TALK</text>',
 photo:'<g stroke="none"><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#e6b749"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#e47c63" transform="rotate(45 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#d7789f" transform="rotate(90 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#a59bce" transform="rotate(135 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#7fa6cf" transform="rotate(180 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#80b9ad" transform="rotate(225 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#97bf82" transform="rotate(270 12 12)"/><ellipse cx="12" cy="7" rx="2.3" ry="4.4" fill="#d0c86e" transform="rotate(315 12 12)"/></g>',
 note:'<path d="M5 10h14M5 14h14M5 18h9"/>',
 call:'<path d="m6 3 4 5-3 3c1.6 3 3 4.4 6 6l3-3 5 4c-1.2 4-4.3 4.1-8 2.2C7.2 17.3 3.1 12.9 2.6 7.6 2.4 5.4 3.5 4 6 3Z" fill="currentColor" stroke="none"/>',
 camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3Z" fill="currentColor" stroke="none"/><circle cx="12" cy="13" r="4" fill="#cdd5df" stroke="none"/><circle cx="12" cy="13" r="2.5" fill="currentColor" stroke="none"/>',
 settings:'<path d="m10 2-1 3-3 1-3-1-1 4 2 2v3l-2 2 2 4 3-1 2 1 1 3h4l1-3 3-1 3 1 1-4-2-2v-3l2-2-2-4-3 1-2-1-1-3Z"/><circle cx="12" cy="12" r="4"/>',
 calendar:'<path d="M5 4h14v16H5ZM5 9h14M8 2v4M16 2v4"/><path d="M9 12h6l-4 6"/>',
 weather:'<circle cx="9" cy="9" r="4" fill="#ffe8a1" stroke="none"/><path d="M9 1v2M1 9h2M3 3l1 1M15 3l-1 1" stroke="#ffe8a1"/><path d="M6 20a4 4 0 0 1 0-8 5 5 0 0 1 9-2 5 5 0 1 1 2 10Z" fill="#fff" stroke="none"/>',
 progress:'<path d="M6 3h12v19H6ZM9 8h6M9 12h6M9 16h4"/><path d="m3 6 2 2-2 2"/>',
 bell:'<path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5ZM10 21h4"/>',
 lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
 back:'<path d="m15 5-7 7 7 7"/>',
 search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 6v1"/>',
 plus:'<path d="M12 4v16M4 12h16"/>',
 person:'<circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',
 chat:'<path d="M3 4h18v13H9l-5 4v-4H3Z"/>',
 menu:'<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>'
};
const svg=type=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${glyphs[type]||glyphs.info}</svg>`;
function avatar(c){
 const id=c.id||'self',src=CONFIG.assets.avatars[id]||'',position=CONFIG.assets.avatarPositions[id]||'50% 50%';
 return `<span class="avatar" style="background:${/^#[\da-f]{3,8}$/i.test(c.color)?c.color:'#879cb2'}"><span class="avatar-fallback">${esc(c.initials)}</span>${src?`<img src="${esc(src)}" alt="${esc(c.name)}的头像" style="object-position:${esc(position)}" loading="lazy">`:''}</span>`;
}
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.closest('.avatar'))e.target.hidden=true},true);
const selfContact=()=>({...CONFIG.owner,id:'self',color:'#a2a1b5'});
function header(title,sub='',tools=''){return `<header class="header"><button class="back" data-action="back" aria-label="返回">${svg('back')}</button><h2>${esc(title)}</h2>${sub?`<small>${esc(sub)}</small>`:''}${tools}</header>`}
function statusIcons(){
 const level=Math.max(0,Math.min(100,parseInt(CONFIG.device.battery)||0));
 return `<svg viewBox="0 0 20 15" fill="currentColor"><rect x="1" y="10" width="3" height="4" rx=".7"/><rect x="6" y="7" width="3" height="7" rx=".7"/><rect x="11" y="4" width="3" height="10" rx=".7"/><rect x="16" y="1" width="3" height="13" rx=".7"/></svg><svg viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M1 5a14 14 0 0 1 18 0M4 8a9 9 0 0 1 12 0M7 11a4.4 4.4 0 0 1 6 0"/><circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 30 15" fill="none"><rect x=".7" y="1" width="25" height="13" rx="3" stroke="currentColor" stroke-opacity=".6"/><path d="M28 5v5" stroke="currentColor" stroke-width="2"/><rect x="2.5" y="2.8" width="${21.4*level/100}" height="9.4" rx="1.5" fill="currentColor"/></svg>`;
}
let wallpaperKey='';
function applyWallpaper(){
 const lock=route.type==='lock',src=(lock?CONFIG.assets.lockWallpaper:CONFIG.assets.wallpaper)||'',pos=(lock?CONFIG.assets.lockWallpaperPosition:CONFIG.assets.wallpaperPosition)||'50% 50%',key=src+'|'+pos,layer=$('#wallpaper');
 layer.style.backgroundPosition=pos;
 if(key===wallpaperKey)return;wallpaperKey=key;layer.style.backgroundImage='none';
 if(src){const probe=new Image();probe.onload=()=>{if(wallpaperKey===key)layer.style.backgroundImage=`url(${JSON.stringify(src)})`};probe.onerror=()=>{if(wallpaperKey===key)layer.style.backgroundImage='none'};probe.src=src;}
}
function appButton(id,name,type,className='',badge=0){return `<button class="app" ${id==='lock'?'data-action="lock"':`data-open="${esc(id)}"`} aria-label="${esc(name)}"><span class="app-icon ${className||type}">${svg(type)}${badge?`<span class="badge">${badge}</span>`:''}</span><span class="app-label">${esc(name)}</span></button>`}
function clockWidget(){
 const [h,m]=CONFIG.device.time.split(':').map(Number),marks=Array.from({length:12},(_,i)=>`<path d="M50 7v5" transform="rotate(${i*30} 50 50)" stroke="currentColor" stroke-width="${i%3?1:2}" opacity="${i%3?.4:.8}"/>`).join('');
 return `<svg viewBox="0 0 100 100" aria-hidden="true">${marks}<path d="M50 50V28" transform="rotate(${(h%12)*30+m/2} 50 50)" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M50 50V17" transform="rotate(${m*6} 50 50)" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="#d7a66e"/></svg>`;
}
function chatScroller(){return $('#view .chat-scroll')||$('#view .chat-list-scroll')||$('#view')}

function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2400)}
function discover(ids=[]){let found=false;ids.forEach(id=>{if(CONFIG.clues.some(c=>c.id===id)&&!state.clues.includes(id)){add('clues',id);found=true}});if(found)toast('发现线索 · 已保存到探索进度')}
function open(type,id,messageId){history.push({...route,scroll:chatScroller().scrollTop});route={type,id,messageId};if(type==='chat'){const c=CONFIG.chats.find(c=>c.id===id);if(c){c.messages.forEach(m=>add('readMessages',m.id));discover(c.clueIds)}}if(['chat','photo','note','call'].includes(type)){add('visited',`${type}:${id}`);const list={photo:CONFIG.photos,note:CONFIG.notes,call:CONFIG.calls}[type];if(list)discover(list.find(x=>x.id===id)?.clueIds)}save();render()}
function unlock(){state.unlocked=true;save();history=[];route={type:'home'};render()}
function back(){route=history.pop()||{type:'home'};render();chatScroller().scrollTop=route.scroll||0}
function notification(n){return `<button class="notification" data-action="notification" data-id="${esc(n.id)}"><span class="meta"><span>${esc(n.app)}${n.statusLabel?' · '+esc(n.statusLabel):''}${state.readNotifications.includes(n.id)?' · 已查看':''}</span><span>${esc(n.time)}</span></span><strong>${esc(n.title)}</strong><p>${esc(n.text)}</p></button>`}
function cluesHTML(ids=[]){return ids.filter(id=>state.clues.includes(id)).map(id=>{const c=CONFIG.clues.find(c=>c.id===id);return c?`<div class="clue"><strong>已记录 · ${esc(c.title)}</strong>${esc(c.description)}</div>`:''}).join('')}
function render(){
const v=$('#view'),t=route.type;$('#phone').classList.toggle('wall',['lock','home'].includes(t));$('#status-time').textContent=CONFIG.device.time;$('#status-right').innerHTML=statusIcons();$('#status-right').setAttribute('aria-label',`信号、Wi-Fi、电量 ${CONFIG.device.battery}`);v.dataset.page=t;$('#phone').dataset.mode=t==='chat'?(CONFIG.chats.find(c=>c.id===route.id)?.kind==='program'?'program':'chat'):t;applyWallpaper();
let html='';
if(t==='lock')html=`<div class="lock"><div class="lock-label">${esc(CONFIG.device.lockHint)}</div><div class="clock">${esc(CONFIG.device.time)}</div><div class="date">${esc(CONFIG.device.date)}</div><div class="lock-owner">${esc(CONFIG.owner.name)}的手机 · ${esc(CONFIG.device.wallpaperLabel)}</div>${CONFIG.notifications.slice(0,2).map(notification).join('')}<button class="unlock" data-action="unlock"><b>⌃</b>向上滑动解锁 · 也可点击</button></div>`;
else if(t==='home'){
 const ui=CONFIG.interface,extras=ui.launcherExtras;
 html=`<div class="home"><div class="widgets"><button class="sys-widget" data-open="calendar" aria-label="打开日历"><span class="month">${esc(ui.calendar.month)}</span><span class="day-number">${esc(ui.calendar.day)}</span><span class="widget-caption">${esc(ui.calendar.year)}</span></button><div class="sys-widget clock-widget" aria-label="${esc(CONFIG.device.time)}">${clockWidget()}<span class="widget-caption" style="color:#cad5e3">${esc(CONFIG.device.carrier)}</span></div></div><div class="appgrid">${CONFIG.apps.filter(a=>a.id!=='calls').map(a=>appButton(a.id,a.name,a.icon,a.icon,a.id==='chats'?totalUnread():0)).join('')}${extras.map(a=>appButton(a.id,a.name,a.icon,a.className)).join('')}</div><div class="desktop-spacer"></div><div class="page-dots" aria-hidden="true"><i></i><i></i></div><div class="dock">${appButton('calls','最近通话','call')}${appButton('notifications','通知','bell','notifications-icon',CONFIG.notifications.filter(n=>!state.readNotifications.includes(n.id)).length)}${appButton('lock','锁屏','lock','lock-icon')}</div></div>`;
}
else if(t==='chats'){
 html=`<div class="chat-list-page">${header('KakaoTalk','',`<button class="icon-button" data-action="search-chats" aria-label="查找聊天">${svg('search')}</button><button class="icon-button" data-open="profile" data-id="self" aria-label="我的资料">${svg('person')}</button>`)}<div class="chat-search" hidden><input id="chat-filter" type="search" aria-label="查找联系人或最后消息" placeholder="查找聊天" autocomplete="off"></div><div class="chat-list-scroll">`+chatList().map(c=>{
  const who=contact(c.contactId),last=ordered(c).at(-1),stamp=c.kind==='program'?c.listTime:last?.time.slice(0,10).replace(/-/g,'.')||'';
  return `<button class="row ${c.kind==='program'?'program-row':''}" data-open="chat" data-id="${esc(c.id)}" data-search="${esc((who.name+' '+(c.preview||last?.text||'')).toLowerCase())}">${avatar(who)}<span class="row-main"><strong>${esc(who.name)}${c.kind==='program'?'<span class="program-label">SMS</span>':''}</strong><div class="preview">${esc(c.preview||last?.text||'暂无消息')}</div></span><span class="row-end">${esc(stamp)}${unread(c)?`<br><span class="dot">${unread(c)}</span>`:''}</span></button>`;
 }).join('')+`</div><nav class="chat-list-nav"><button data-open="profile" data-id="self">${svg('person')}我的资料</button><button data-action="chat-list-top">${svg('chat')}聊天</button><button data-open="settings">${svg('menu')}更多</button></nav></div>`;
}
else if(t==='chat'){
 const c=CONFIG.chats.find(x=>x.id===route.id);
 if(c){
  const who=contact(c.contactId),messages=ordered(c);let prevDay='',prevMessage=null;
  html=`<div class="chat ${c.kind==='program'?'program-chat':''}">${header(who.name,c.kind==='program'?'节目短信':'',`<button class="icon-button" data-open="profile" data-id="${esc(c.contactId)}" aria-label="对话信息">${svg('info')}</button>`)}${c.kind==='archive'?`<div class="chat-notice" data-role="chat-notice">${esc(c.notice)}</div>`:''}<div class="chat-scroll">${c.context?`<div class="chat-context">${esc(c.context)}</div>`:''}`;
  html+=messages.map(m=>{
   const d=m.dateLabel||date(m.time),newDay=d!==prevDay,day=newDay?`<div class="day"><span>${esc(d)}</span></div>`:'';prevDay=d;
   const self=m.sender==='self',gap=prevMessage?.time&&m.time?new Date(m.time)-new Date(prevMessage.time):0,first=newDay||!prevMessage||prevMessage.sender!==m.sender||gap>300000||m.messageType==='heart-received';prevMessage=m;
   const senderName=m.messageType==='heart-received'?'节目组 · 匿名心动短信':who.name;
   return day+`<div class="message ${self?'self':''} ${first?'first-message':''}" id="${esc(m.id)}" data-message-type="${esc(m.messageType||'chat')}">${!self?`<div class="avatar-slot">${first?avatar(who):''}</div>`:''}<div class="message-content">${!self&&first?`<div class="sender-name">${esc(senderName)}</div>`:''}<div class="bubble-line"><div class="bubble">${esc(m.text)}</div><span class="msgtime">${m.time?esc(time(m.time)):''}${m.receipt?`<br>${esc(m.receipt)}`:''}</span></div></div></div>`;
  }).join('');
  html+=`</div><div class="readonly-composer">${avatar(selfContact())}<span class="composer-label">只读记录 · 无法发送消息</span><span class="composer-lock">${svg('lock')}</span></div></div>`;
 }
}
else if(t==='profile'){
 const who=route.id==='self'?selfContact():contact(route.id),c=CONFIG.chats.find(c=>c.contactId===route.id);
 html=header(route.id==='self'?'我的资料':'对话信息')+`<div class="profile">${avatar(who)}<h3>${esc(who.name)}</h3><p>${esc(route.id==='self'?'本机使用者':c?.kind==='program'?'节目通知与匿名传达 · 每晚一条心动短信':c?.notice||who.subtitle||'联系人')}</p>${c?`<button class="row" data-open="chat" data-id="${esc(c.id)}"><span class="row-main"><strong>查看对话</strong></span>›</button>`:''}</div>`;
}
else if(t==='settings'){
 html=header('设置')+`<button class="row" data-open="profile" data-id="self">${avatar(selfContact())}<span class="row-main"><strong>${esc(CONFIG.owner.name)}</strong><div class="preview">我的资料</div></span>›</button><button class="row" data-open="progress"><span class="row-main"><strong>探索进度</strong><div class="preview">${state.visited.length} 项已查看 · ${state.clues.length} 条线索</div></span>›</button><button class="row" data-open="notifications"><span class="row-main"><strong>通知</strong></span>›</button><button class="row" data-action="lock"><span class="row-main"><strong>锁定屏幕</strong></span>›</button>`;
}
else if(t==='calendar'){
 html=header('日历')+`<div class="utility"><h3>${esc(CONFIG.interface.calendar.year)} · ${esc(CONFIG.interface.calendar.month)}</h3><div class="calendar-grid">${Array.from({length:30},(_,i)=>`<span class="${i+1===Number(CONFIG.interface.calendar.day)?'current':''}">${i+1}</span>`).join('')}</div></div>`;
}
else if(t==='camera'||t==='weather'){
 const item=CONFIG.interface.placeholders[t];html=header(item.title)+`<div class="utility"><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p></div>`;
}
else if(t==='photos')html=header('相册',`${CONFIG.photos.length} 张`)+`<div class="section-label">MOMENTS / 片刻</div><div class="gallery">`+recent(CONFIG.photos).map(p=>`<button class="photo-card" data-open="photo" data-id="${esc(p.id)}"><span class="art ${p.palette==='night'?'night':''}">${esc(p.title)}</span><strong>${esc(p.title)}</strong><small>${esc(p.date)}</small></button>`).join('')+'</div>';
else if(t==='photo'){const p=CONFIG.photos.find(x=>x.id===route.id);if(p)html=header(p.title)+`<div class="photo-detail"><div class="art ${p.palette==='night'?'night':''}" role="img" aria-label="${esc(p.description)}">${esc(p.title)}</div><div class="timestamp">${esc(p.date)} · 文字照片</div><div class="prose">${esc(p.description)}</div>${cluesHTML(p.clueIds)}</div>`}
else if(t==='notes')html=header('备忘录',`${CONFIG.notes.length} 篇`)+`<div class="section-label">NOTES / 日常记录</div>`+CONFIG.notes.map(n=>`<button class="row" data-open="note" data-id="${esc(n.id)}"><span class="row-main"><strong>${esc(n.title)}</strong><div class="preview">${esc(n.body.replace(/\n/g,' · ').slice(0,32)+(n.body.replace(/\n/g,' · ').length>32?'…':''))}</div><div class="timestamp" style="margin:9px 0 0">${esc(n.date)}</div></span><span>›</span></button>`).join('');
else if(t==='note'){const n=CONFIG.notes.find(x=>x.id===route.id);if(n)html=header('备忘录')+`<article class="note-paper"><h3>${esc(n.title)}</h3><div class="timestamp">${esc(n.date)}</div><div class="prose">${esc(n.body)}</div>${cluesHTML(n.clueIds)}</article>`}
else if(t==='calls')html=header('最近通话')+`<div class="section-label">RECENTS / 通话记录</div>`+recent(CONFIG.calls).map(c=>`<button class="row" data-open="call" data-id="${esc(c.id)}">${avatar(contact(c.contactId))}<span class="row-main"><strong class="${c.missed?'missed':''}">${esc(contact(c.contactId).name)}</strong><div class="preview">${esc(c.type)}</div></span><span class="row-end">${esc(c.time)}<br>ⓘ</span></button>`).join('');
else if(t==='call'){const c=CONFIG.calls.find(x=>x.id===route.id);if(c)html=header('通话详情')+`<div class="call-detail">${avatar(contact(c.contactId)).replace('class="avatar"','class="avatar detail-avatar"')}<h3>${esc(contact(c.contactId).name)}</h3><div class="timestamp">${esc(c.time)}</div><p class="${c.missed?'missed':''}">${esc(c.type)}</p><div class="prose">${esc(c.detail)}</div><div class="readonly">仅查看历史记录，不会拨出电话</div>${cluesHTML(c.clueIds)}</div>`}
else if(t==='notifications')html=header('通知中心')+`<div class="notice-list">${CONFIG.notifications.map(notification).join('')||'<div class="empty">暂无通知</div>'}</div>`;
else if(t==='progress')html=header('探索进度',`${state.clues.length} 条线索`)+`<div class="section-label">已发现的线索</div><div style="padding:0 22px">${cluesHTML(state.clues)||'<p class="empty">还没有发现线索，按自己的顺序探索手机吧。</p>'}</div><div class="section-label">查看记录 · ${state.visited.length} 项</div>`+state.visited.map(key=>{const [type,id]=key.split(':');const item=({chat:CONFIG.chats,photo:CONFIG.photos,note:CONFIG.notes,call:CONFIG.calls}[type]||[]).find(x=>x.id===id);return item?`<button class="row" data-open="${esc(type)}" data-id="${esc(id)}"><span class="row-main"><strong>${esc(item.title||contact(item.contactId).name)}</strong><div class="preview">${({chat:'聊天',photo:'相册',note:'备忘录',call:'通话'})[type]} · 已查看</div></span><span>›</span></button>`:''}).join('')+`<button class="reset" data-action="reset">重置本机探索进度</button><div class="empty">${storageOK?'进度自动保存在当前浏览器中。':'浏览器存储不可用，进度仅保留在本次页面中。'}</div>`;
v.style.touchAction=t==='lock'?'pan-x pan-down':'auto';
v.innerHTML=html||header('内容不存在')+'<div class="empty">请返回检查 CONFIG 的内容引用。</div>';v.scrollTop=0;
if(t==='chat'){
 const scroller=chatScroller(),target=route.messageId?document.getElementById(route.messageId):null;
 if(target)scroller.scrollTop=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-12;
 else scroller.scrollTop=scroller.scrollHeight;
}

}
$('#phone').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('homebar')){if(route.type==='lock')unlock();else{history=[];route={type:'home'};render()}return}const a=b.dataset.action;if(a==='search-chats'){const box=$('.chat-search');box.hidden=!box.hidden;if(!box.hidden)$('#chat-filter').focus();else{$('#chat-filter').value='';document.querySelectorAll('.chat-list-scroll .row').forEach(r=>r.hidden=false)}return}else if(a==='chat-list-top'){const list=$('.chat-list-scroll');if(list)list.scrollTop=0;return}else if(a==='unlock')unlock();else if(a==='back')back();else if(a==='lock'){history=[];route={type:'lock'};render()}else if(a==='notification'){const n=CONFIG.notifications.find(x=>x.id===b.dataset.id);if(!n)return;add('readNotifications',n.id);if(route.type==='lock'){unlock()}open(n.target.type,n.target.id,n.target.messageId)}else if(a==='reset'){if(confirm('清除这部手机在当前浏览器中的已读状态、线索和探索进度？')){state=fresh();save();history=[];route={type:'lock'};render();toast('探索进度已重置')}}else if(b.dataset.open)open(b.dataset.open,b.dataset.id)});
document.addEventListener('input',e=>{if(e.target.id==='chat-filter'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.chat-list-scroll .row').forEach(row=>row.hidden=!row.dataset.search.includes(q))}});
let swipe=null;$('#view').addEventListener('pointerdown',e=>{if(route.type==='lock')swipe={x:e.clientX,y:e.clientY}});$('#view').addEventListener('pointerup',e=>{if(swipe&&route.type==='lock'&&swipe.y-e.clientY>65&&Math.abs(swipe.x-e.clientX)<100)unlock();swipe=null});$('#view').addEventListener('pointercancel',()=>swipe=null);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(route.type!=='lock')back()}if(e.key==='ArrowUp'&&route.type==='lock')unlock()});
render();
</script>
</body>
</html>
